# Configuração padrão do InMotion (spec 004). Toda seção tem de bater com os padrões das
# dataclasses em inmotion/config/schema.py (tests/test_config_loader.py confere).
# Precedência: este arquivo <- config/games/<jogo>.yaml <- perfil do usuário <- --set.

camera:
  # Provisório: no PC de desenvolvimento o índice 0 é uma câmera virtual (Snap Camera) e a
  # webcam real é a 1. Fonte única do padrão (app e ferramentas leem daqui).
  index: 1
  backend: dshow          # dshow | msmf | any
  width: 640
  height: 480
  fps: 60
  fourcc: MJPG
  exposure: null          # null = automática

pose:
  model_dir: models
  variant: full           # lite | full | heavy
  min_detection_confidence: 0.5
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5

preprocess:
  blur_sigma: 1.0         # pixels (A2); null desliga a suavização
  sobel_debug: false

filters:
  kind: one_euro          # none | ema | one_euro
  ema:                    # R1-R3: 0 < alpha <= 1
    alpha: 0.5
    gap_max_s: 0.3
  one_euro:               # R4: min_cutoff > 0, beta >= 0, d_cutoff > 0
    min_cutoff: 1.0
    beta: 0.007
    d_cutoff: 1.0
    gap_max_s: 0.3

# Parâmetros por gesto (spec 008): theta_on, theta_off, direction, debounce_frames, cooldown_s.
# Valores INICIAIS, a refinar com dados de gravação (specs 010/011); nunca mude "no olho".
#   attack/use: alcance frontal r = (z_ombro - z_pulso)/(comprimento do braço), |r| <= 1 (A7/A8)
#   jump:       (base - h)/s, em larguras de ombro (J1); trigger
#   crouch:     c = (ȳ_ombros - base_ombros)/s, em larguras de ombro (crouch.feature abaixo)
#   walk:       marcha no lugar em curso (1 andando, 0 parado), spec 018
#   sprint:     cadência da marcha, em passos/s (R1), spec 018
#   lean:       inclinação do tronco para frente, em rad (A9); sem binding no Minecraft
# direction: above ativa com f > theta_on e solta com f < theta_off (theta_on > theta_off).
gestures:
  attack: {theta_on: 0.70, theta_off: 0.55, direction: above, debounce_frames: 3, cooldown_s: 0.0}
  use:    {theta_on: 0.70, theta_off: 0.55, direction: above, debounce_frames: 3, cooldown_s: 0.0}
  jump:   {theta_on: 0.25, theta_off: 0.15, direction: above, debounce_frames: 2, cooldown_s: 0.0}
  # crouch (spec 017 T7, 5 sessões guiadas de 01/11/2026): agachadinha do pulo máx 0,66 e
  # inclinar máx 0,22; agachar mediana >= 1,18. theta_on 0,9 = 1,36x a agachadinha e dá
  # mais folga ao ARMING com o quadril ainda visível (com 1,0: visibilidade mín 0,59).
  # Com crouch.feature: hip os valores antigos eram theta_on 0.35 e theta_off 0.25.
  crouch: {theta_on: 0.9,  theta_off: 0.6,  direction: above, debounce_frames: 4, cooldown_s: 0.0}
  lean:   {theta_on: 0.30, theta_off: 0.20, direction: above, debounce_frames: 4, cooldown_s: 0.0}
  # walk e sprint (spec 018): sinais do MarchTracker; o início e o fim do andar vêm de
  # march.min_steps e march.step_timeout_s. Valores iniciais da T0 de 01/11/2026.
  walk:   {theta_on: 0.6,  theta_off: 0.4,  direction: above, debounce_frames: 1, cooldown_s: 0.0}
  # sprint: marcha lenta 1,2-1,3 passos/s, rápida 2,0-2,6; f_on 1,8 e f_off 1,5.
  sprint: {theta_on: 1.8,  theta_off: 1.5,  direction: above, debounce_frames: 1, cooldown_s: 0.0}

# Sinal do agachar (spec 017 RF3): shoulders = queda dos ombros (continua visível sem o
# quadril); hip = (h - base)/s, do quadril (spec 008). Ao trocar, ajuste gestures.crouch.
crouch:
  feature: shoulders

# Base adaptativa R7 da altura do quadril (pulo) e dos ombros (agachar): média dos primeiros
# init_frames frames de repouso e depois EMA lenta de taxa rate, só em repouso.
baseline:
  init_frames: 15
  rate: 0.02
  # A base só anda com |h - b|/s < rest_band (larguras de ombro). Sem isso a descida do
  # agachar arrastava a base e, ao levantar, saía um pulo (3 de 9 agachamentos em
  # 01/11/2026); 0,15 = theta_off do pulo, acima do ruído parado (|j| <= 0,05).
  rest_band: 0.15

# ActionMapper: duração do tap de um gesto trigger (> 1 tick de 50 ms do Minecraft).
mapper:
  tap_hold_s: 0.08

# Geometria (A6): visibilidade mínima dos pontos usados e largura mínima de ombros, em px.
geometry:
  visibility_threshold: 0.6
  min_shoulder_px: 10.0

safety:
  lost_timeout_s: 0.2     # sem pose por tanto tempo solta todo o input (R5 temporal)
  pause_key: f8
  exit_key: f9
  always_release: [mouse_left, mouse_middle, mouse_right]
  # Pose só conta com ombros e quadris visíveis; abaixo disso é fantasma ou parcial.
  min_torso_visibility: 0.5
  # Pose contínua por este tempo até valer. Pose "fantasma" de objetos durou no máximo
  # 0,73 s na gravação recordings/fantasma.npz (29/10/2026); 1,0 s dá folga de 1,37x.
  min_track_s: 1.0
  # Sem batida do loop por tanto tempo, o watchdog solta todo o input (loop travado).
  watchdog_timeout_s: 0.5

# Zona de saída temporária: mão no retângulo (coordenadas normalizadas da imagem, sem
# espelhamento) por hold_s segundos encerra o app. Provisória até a spec 009.
exit_zone:
  x0: 0.02
  y0: 0.12
  x1: 0.22
  y1: 0.42
  hold_s: 4.0
  min_visibility: 0.5

overlay:
  enabled: true           # false = sem janela de debug (mais FPS)

logging:
  level: INFO             # DEBUG | INFO | WARNING | ERROR
  file: null              # nome simples vai para logs/

handedness: right         # right | left
