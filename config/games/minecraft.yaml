# hold mantém a tecla pressionada durante o gesto. trigger dá um toque de mapper.tap_hold_s.
# Use --set handedness=left para atacar com o braço esquerdo.
name: minecraft
bindings:
  attack:       {input: mouse_left,  kind: hold}
  use:          {input: mouse_right, kind: hold}
  jump:         {input: space,       kind: trigger}
  crouch:       {input: shift,       kind: hold}
  walk:         {input: w,           kind: hold}
  sprint:       {input: ctrl,        kind: hold}
  walk_back:    {input: s,           kind: hold}
  strafe_left:  {input: a,           kind: hold}
  strafe_right: {input: d,           kind: hold}

# Em cada grupo exclusivo, vence o primeiro gesto listado em priority.
# Na corrida, walk e sprint mantêm W e Ctrl pressionados juntos.
# Esticar os dois braços ao mesmo tempo suspende os dois cliques.
arbiter:
  priority: [both_arms, crouch, jump, attack, use, walk, sprint, walk_back, strafe_left, strafe_right]
  exclusive:
    - [crouch, jump]
    - [crouch, walk]
    - [crouch, sprint]
    - [crouch, walk_back]
    - [crouch, strafe_left]
    - [crouch, strafe_right]
    - [walk, walk_back]
    - [sprint, walk_back]
    - [strafe_left, strafe_right]
  combos:
    both_arms: [attack, use]
