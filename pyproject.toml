[project]
name = "inmotion"
version = "0.3.0"
description = "Controle de jogos por visão computacional com uma webcam (Projeto A3)."
requires-python = ">=3.10,<3.11"  # Ambiente validado; veja CONTRIBUTING.md.

[tool.ruff]
target-version = "py310"
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade (até py310)
    "B",        # bugbear
    "SIM",      # simplificações
    "C4",       # comprehensions
    "PT",       # estilo pytest
    "NPY",      # numpy
    "RUF",      # regras do ruff
    "TID",      # restrições de importação
    "T20",      # usar logging para a saída do aplicativo
]
# Símbolos matemáticos usados nas docstrings.
allowed-confusables = ["·", "×", "−", "α", "σ", "θ", "ε", "ν", "ρ", "τ", "∪"]

# Os adaptadores concentram o acesso ao hardware e ao relógio do sistema.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"cv2".msg = "Núcleo puro: cv2 só em adaptadores (CONTRIBUTING.md)."
"mediapipe".msg = "Núcleo puro: mediapipe só no adaptador de pose (CONTRIBUTING.md)."
"pydirectinput".msg = "Núcleo puro: pydirectinput só no backend de input (CONTRIBUTING.md)."
"inmotion.overlay".msg = "Spec 009: só a composição desenha; o núcleo não importa o overlay."
"vgamepad".msg = "Núcleo puro: vgamepad só no backend de gamepad (CONTRIBUTING.md)."
"time.time".msg = "Tempo explícito: o núcleo recebe `t` como parâmetro (use um Clock no adaptador)."
"time.monotonic".msg = "Tempo explícito: o núcleo recebe `t` como parâmetro (use um Clock no adaptador)."
"time.perf_counter".msg = "Tempo explícito: o núcleo recebe `t` como parâmetro (use um Clock no adaptador)."

[tool.ruff.lint.per-file-ignores]
"inmotion/__main__.py" = ["TID251"]
"inmotion/app.py" = ["TID251"]
"inmotion/clock.py" = ["TID251"]  # único lugar do núcleo que lê o relógio
"inmotion/capture/**" = ["TID251"]
"inmotion/vision/pose.py" = ["TID251"]
"inmotion/vision/preprocess.py" = ["TID251"]
"inmotion/input/keyboard_mouse.py" = ["TID251"]
"inmotion/input/gamepad.py" = ["TID251"]
"inmotion/overlay.py" = ["TID251"]
"inmotion/recorder.py" = ["TID251"]
"tools/**" = ["TID251"]
"tests/**" = ["TID251", "T20"]  # T20: testes de hardware imprimem medições

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
# A suíte padrão inclui os testes lentos. Use -m hardware para os testes com dispositivos.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not hardware"]
markers = [
    "hardware: precisa de webcam e/ou injeção de input no Windows (rodar com -m hardware)",
    "slow: teste demorado (replay longo, hypothesis com muitos exemplos)",
]
xfail_strict = true

[tool.mypy]
python_version = "3.10"
files = ["inmotion"]
warn_unused_configs = true
warn_redundant_casts = true
show_error_codes = true
pretty = true

# O mypy exige opções individuais para aplicar a checagem estrita por módulo.
[[tool.mypy.overrides]]
module = [
    "inmotion.types",
    "inmotion.ports",
    "inmotion.pipeline",
    "inmotion.history",
    "inmotion.session",
    "inmotion.voice",
    "inmotion.watchdog",
    "inmotion.vision.landmarks",
    "inmotion.vision.geometry",
    "inmotion.vision.kernels",
    "inmotion.vision.color",
    "inmotion.recording",
    "inmotion.replay",
    "inmotion.metrics",
    "inmotion.exit_zone",
    "inmotion.fps",
    "inmotion.filters.*",
    "inmotion.gestures.*",
    "inmotion.safety",
    "inmotion.mapping",
    "inmotion.input.backend",
    "inmotion.config.schema",
    "inmotion.config.validate",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true

# Bibliotecas sem stubs
[[tool.mypy.overrides]]
module = ["pydirectinput.*", "mediapipe.*"]
ignore_missing_imports = true
