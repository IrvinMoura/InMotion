# Integração contínua do InMotion (spec 015, RF7): roda o Definition of Done a cada push/PR.
name: CI

on:
  push:
  pull_request:

# Permissão mínima: o workflow só lê o repositório.
permissions:
  contents: read

# Cancela execuções antigas do mesmo ref quando chega um commit novo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos e testes
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10 com cache do pip
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatação (ruff format --check)
        run: ruff format --check .

      - name: Tipos (mypy)
        run: mypy

      # Testes de hardware (webcam / input real) e lentos ficam de fora do CI.
      - name: Testes (pytest)
        run: pytest -m "not hardware and not slow"
